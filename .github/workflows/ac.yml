name: Run Node Script

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_scraper]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ac repo
        uses: actions/checkout@v6
        with:
          repository: tgiy/ac
          ref: main
          token: ${{ secrets.CD }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install axios moment fs.promises

      - name: Run script
        env:
          GT10: ${{ secrets.GT10 }}
          GT9: ${{ secrets.GT9 }}
          GT8: ${{ secrets.GT8 }}
          GT7: ${{ secrets.GT7 }}
          GT6: ${{ secrets.GT6 }}
          GT5: ${{ secrets.GT5 }}
          GT4: ${{ secrets.GT4 }}
          GT3: ${{ secrets.GT3 }}
          GT2: ${{ secrets.GT2 }}
          GT: ${{ secrets.GT }}
          KEY: ${{ secrets.KEY }}
          KEY_O: ${{ secrets.KEY_O }}
          URL_O: ${{ secrets.URL_O }}
          MODEL_O: ${{ secrets.MODEL_O }}
          MSG_O: ${{ secrets.MSG_O }}
        run: node 1.js
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: tgiy/dc
          ref: main
          path: dc
          token: ${{ secrets.CD }}
      - name: Copy generated json files to dc
        run: |
          mkdir -p dc/logs
          [ -f /tmp/s.json ] && cp /tmp/s.json dc/logs/s.json
          [ -f /tmp/o.json ] && cp /tmp/o.json dc/logs/o.json

      - name: Check for changes
        id: check_changes
        run: |
          cd dc
          s_content=$(cat logs/s.json 2>/dev/null | tr -d '[:space:]')
          if [ "$s_content" = "[]" ]; then
              git checkout logs/s.json 2>/dev/null || true
          fi
          o_content=$(cat logs/o.json 2>/dev/null | tr -d '[:space:]')
          if [ "$o_content" = "[]" ]; then
              git checkout logs/o.json 2>/dev/null || true
          fi
          git add .
          modified=$(git status --porcelain)
          if [ -n "$modified" ]; then
              echo "changes=true" >> $GITHUB_OUTPUT
          else
              echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          cd dc
          git config --global user.name 'tgiy'
          git config --global user.email 'tgiy@action.com'
          git commit -m "Update logs (s.json & o.json)"
          git remote set-url origin https://tgiy:${{ secrets.CD }}@github.com/tgiy/dc.git
          git pull --rebase origin main
          git push origin main
